version: "2"
run:
  go: "1.25"
  modules-download-mode: vendor
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - decorder
    - dupword
    - durationcheck
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - predeclared
    - reassign
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    - whitespace
  settings:
    errcheck:
      check-blank: true
      exclude-functions:
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).ForceNew
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).SetNew
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).SetNewComputed
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
        - io.Close
        - github.com/parsoFish/terraform-provider-betterado/azuredevops/internal/acceptancetests/testutils.CaptureLiveEvidence
    misspell:
      ignore-rules:
        - hdinsight
        - exportfs
    nakedret:
      max-func-lines: 30
    predeclared:
      ignore:
        - new
        - min
        - max
    tagalign:
      sort: true
      order:
        - json
        - tfschema
        - computed
    staticcheck:
      # Preserve the pre-v2 baseline: golangci v1.64.8 did NOT enable the
      # stylecheck (ST*) or quickfix (QF*) families, so the v1->v2 upgrade
      # (required for go1.25) must not suddenly demand fixing ~436 legacy
      # style findings in inherited upstream code. Keep the real-bug SA*
      # checks. New code is held to the same bar it was before.
      checks:
        - all
        - -ST1*
        - -QF1*
    gocritic:
      # deprecatedComment is a v2-default gocritic check not enforced under
      # v1.64.8; it flags 1 pre-existing legacy comment. Disable to match baseline.
      disabled-checks:
        - deprecatedComment
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
