# Publishes a signed provider release to GitHub (which the Terraform Registry
# then ingests) whenever a semver tag like `v0.1.0` is pushed.
#
# Required repository secrets (see docs/RELEASING.md):
#   GPG_PRIVATE_KEY — ASCII-armored private key used to sign SHA256SUMS
#   PASSPHRASE      — passphrase for that key
# GITHUB_TOKEN is provided automatically by Actions.
name: release

on:
  push:
    tags:
      - 'v*'
  # workflow_dispatch lets tag-on-changelog start a release for the tag it just
  # created. A tag pushed by the Actions GITHUB_TOKEN does NOT trigger the `push`
  # event above (GitHub's anti-recursion rule), but workflow_dispatch IS one of
  # the documented exceptions that GITHUB_TOKEN may trigger — so this is the seam
  # that makes auto-publish actually fire.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a tag push github.ref is the tag; on workflow_dispatch use the
          # supplied tag input so GoReleaser builds the correct version.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
